<!DOCTYPE html>
<html>
<head>
      <title>車避けゲーム</title>

           <style>
body {
margin: 0;
background-color: #222;
touch-action: none;
}

#road {
width: 300px;
height: 100vh;
background-color: #555;
margin: auto;
touch-action: none;
}

#player {
width: 40px;
height: 70px;
background-color: red;
position: absolute;
bottom: 20px;
}
           </style>

</head>

<body>
          <div id="road">
                   <div id="player"></div>
          </div>
<script>
const player = document.getElementById("player");
const road = document.getElementById("road");

document.addEventListener("touchmove", function(event) {

    const x = event.touches[0].clientX;

    const roadRect = road.getBoundingClientRect();

    const roadLeft = roadRect.left;
    const roadRight = roadRect.left + roadRect.width;

    const playerWidth = player.offsetWidth;

    if (x < roadLeft) {
        player.style.left = roadLeft + "px";
    }

    if (x + playerWidth > roadRight) {
        player.style.left = roadRight - playerWidth + "px";
    }

    if (x >= roadLeft && x + playerWidth <= roadRight) {
        player.style.left = x + "px";
    }

});
</script>

</body>

</html>
