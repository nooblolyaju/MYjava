<!DOCTYPE html>
<html>
<head>
    <title>カウンター</title>

       <style>

#up {
display: flex;
justify-content: center;
align-items: center;
}

#count {
font-size: 60px;
}

button {
border-radius: 10px;
font-size: 20px;
padding: 10px 20px;
border: none;
background-color: red;
color: white;
transition: 0.1s;
}

button:active {
transform: scale(0.85);
opacity: 0.7;
}

body {
background-color: #222;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
gap: 15px;
}

       </style>

</head>

<body>

<div id="up">

       <h1>アップグレードに必要なクリック数〇〇</h1>

       <button id="upgrade">クリック数+1</button>

</div>

<div id="card">

       <h1>カウンター</h1>

       <p id="count">0</p>

       <button id="button">クリック！</button>

       <button id="reset">リセットしちゃうにょ〜ん</button>

</div>

<script>
       let count = 0;

       const button = document.getElementById("button")

       const reset = document.getElementById("reset")

       const countText = document.getElementById("count")

       button.onclick = function() {
               count = count + 1;
               countText.textContent = count;

};


       reset.onclick = function() {
               count = 0;

countText.textContent = count;
};
</script>

</body>
</html>
