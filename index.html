<!DOCTYPE html>
<html>
<head>
    <title>カウンター</title>

       <style>

body {
background-color: #222;
}

#count {
font-size: 60px;
}

button {
border-radius: 10px;
font-size: 20px;
padding: 10px 20px;
}

body {
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
gap: 15px;
}

       </style>

</head>

<body>
       <h1>カウンター</h1>

       <p id="count">0</p>

       <button id="button">クリック！</button>

       <button id="reset">リセットしちゃうにょ〜ん</button>

<script>
       let count = 0;

       const button = document.getElementById("button")

       const reset = document.getElementById("reset")

       const countText = document.getElementById("count")

       button.onclick = function() {
               count = count + 1;
               countText.textContent = count;
};


       reset.onclick = function() {
               count = 0;

countText.textContent = count;
};
</script>

</body>
</html>
